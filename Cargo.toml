[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/a3-application",
    "crates/a3-domain",
    "crates/a3-protocol",
    "crates/a3-provider",
    "crates/a3-repo-index",
    "crates/a3-storage-libsql",
    "crates/a3-workspace",
    "tests/language-adapter-contract",
    "tests/model-provider-contract",
    "tests/storage-contract",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-only"

[workspace.dependencies]
a3-application = { path = "crates/a3-application" }
a3-domain = { path = "crates/a3-domain" }
a3-protocol = { path = "crates/a3-protocol" }
a3-repo-index = { path = "crates/a3-repo-index" }
a3-language-adapter-contract-tests = { path = "tests/language-adapter-contract" }
a3-model-provider-contract-tests = { path = "tests/model-provider-contract" }
a3-storage-libsql = { path = "crates/a3-storage-libsql" }
a3-storage-contract-tests = { path = "tests/storage-contract" }
a3-workspace = { path = "crates/a3-workspace" }
blake3 = "=1.8.5"
crossbeam-channel = "=0.5.16"
futures = "=0.3.32"
gix = { version = "=0.86.0", default-features = false, features = ["sha1", "sha256"] }
libsql = { version = "=0.9.29", default-features = false, features = ["core"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = { version = "=0.9.12", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "=1.53.1", default-features = false }
tree-sitter = { version = "=0.26.11", default-features = false, features = ["std"] }
tree-sitter-javascript = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-dialog = "=2.7.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
