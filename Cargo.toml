[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "crates/a3-application",
    "crates/a3-domain",
    "crates/a3-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-only"

[workspace.dependencies]
a3-application = { path = "crates/a3-application" }
a3-domain = { path = "crates/a3-domain" }
a3-protocol = { path = "crates/a3-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = "=2.11.5"
tauri-build = "=2.6.3"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
